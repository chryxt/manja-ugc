name: Live E2E Sandbox Launcher

on:
  workflow_dispatch:
    inputs:
      product_dna_model:
        description: Gemini model for Product DNA
        required: true
        type: string
      ugc_script_model:
        description: OpenAI model for UGC script generation
        required: true
        type: string
      veo_model:
        description: Gemini/Veo model for video generation
        required: true
        type: string
      timeout_minutes:
        description: Maximum E2E runtime in minutes
        required: false
        default: '45'
        type: string

permissions:
  contents: read

concurrency:
  group: live-e2e-sandbox-launcher
  cancel-in-progress: false

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DATABASE_URL: ${{ secrets.SANDBOX_DATABASE_URL }}
      REDIS_URL: ${{ secrets.SANDBOX_REDIS_URL }}
      E2E_ACTOR_USER_ID: ${{ secrets.E2E_ACTOR_USER_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      E2E_PRODUCT_DNA_MODEL: ${{ inputs.product_dna_model }}
      E2E_UGC_SCRIPT_MODEL: ${{ inputs.ugc_script_model }}
      E2E_VEO_MODEL: ${{ inputs.veo_model }}

    steps:
      - name: Checkout E2E implementation branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/node-backend-foundation-v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Provision sandbox schema
        shell: bash
        run: |
          set -euo pipefail
          READY=$(psql "$DATABASE_URL" -Atqc "SELECT CASE WHEN to_regprocedure('private.create_domain_job_and_reserve_credits(uuid,text,uuid,text,uuid,uuid)') IS NOT NULL AND to_regprocedure('private.schedule_job_wakeup(uuid,uuid,integer)') IS NOT NULL THEN 'yes' ELSE 'no' END")
          if [ "$READY" = "yes" ]; then
            echo "Sandbox schema already provisioned; skipping migrations."
            exit 0
          fi

          echo "Sandbox schema is not provisioned. Applying migrations 01-14 forward-only..."
          for migration in db/migrations/*.sql; do
            echo "Applying ${migration}"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck E2E implementation
        run: npm run typecheck

      - name: Run live E2E sandbox
        shell: bash
        run: |
          if ! [[ "${{ inputs.timeout_minutes }}" =~ ^[0-9]+$ ]]; then
            echo "timeout_minutes must be a positive integer"
            exit 1
          fi
          if [ "${{ inputs.timeout_minutes }}" -lt 1 ]; then
            echo "timeout_minutes must be at least 1"
            exit 1
          fi
          export E2E_TIMEOUT_MS="$(( ${{ inputs.timeout_minutes }} * 60000 ))"
          npm run test:e2e:sandbox
